name: Release Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Apple Silicon M-Series)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri macOS App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Antigravity Switcher v__VERSION__"
          releaseBody: "自动编译发布的 Antigravity Switcher（含 macOS Apple Silicon 与 Windows）"
          releaseDraft: false
          prerelease: false

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Switcher-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Windows App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Antigravity Switcher v__VERSION__"
          releaseBody: "自动编译发布的 Antigravity Switcher（含 macOS Apple Silicon 与 Windows）"
          releaseDraft: false
          prerelease: false
