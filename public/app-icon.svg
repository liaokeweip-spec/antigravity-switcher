<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变：深空黑蓝，极富品质感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- 边框微光 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- 字母 A 主体渐变：电光蓝到量子青 -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- A 字母高光投影 -->
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- 环后半段渐变（稍微暗一些，强化纵深） -->
    <linearGradient id="ringBackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- 环前半段渐变（耀眼发光，处于最前方） -->
    <linearGradient id="ringFrontGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 环的前景强光晕 -->
    <filter id="glowRing" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#0ea5e9" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. 圆角底座 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- 背景粒子微光漫反射 -->
  <circle cx="512" cy="512" r="320" fill="#0284c7" opacity="0.15" filter="blur(60px)" />

  <!-- 2. 45° 倾斜椭圆环 - 后半段（被 A 字母遮挡的部分） -->
  <g transform="translate(512, 530) rotate(-45)">
    <!-- 后半段弧：从 -410,0 到 410,0 的上半圆弧（远端） -->
    <path d="M -410,0 A 410,140 0 0,1 410,0" fill="none" stroke="url(#ringBackGrad)" stroke-width="44" stroke-linecap="round" />
  </g>

  <!-- 3. 中间核心：科技大写字母 A -->
  <g filter="url(#glowA)">
    <!-- 字母 A 主体多边形 -->
    <path d="
      M 480,210
      L 544,210
      L 740,750
      L 630,750
      L 582,610
      L 442,610
      L 394,750
      L 284,750
      Z
      M 464,530
      L 560,530
      L 512,380
      Z
    " fill="url(#aGrad)" fill-rule="evenodd" />

    <!-- A 顶部的科技发光切角微标 -->
    <polygon points="492,206 532,206 512,246" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 4. 45° 倾斜椭圆环 - 前半段（环绕并包裹在 A 字母前方） -->
  <g transform="translate(512, 530) rotate(-45)" filter="url(#glowRing)">
    <!-- 前半段弧：从 410,0 到 -410,0 的下半圆弧（近端） -->
    <path d="M 410,0 A 410,140 0 0,1 -410,0" fill="none" stroke="url(#ringFrontGrad)" stroke-width="46" stroke-linecap="round" />
    
    <!-- 环上的能量高光亮点 (轨道粒子) -->
    <circle cx="120" cy="136" r="14" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)" />
    <circle cx="-160" cy="128" r="9" fill="#e0f2fe" opacity="0.9" />
  </g>
</svg>
